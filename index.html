<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daktylios Check</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f3f5f2; --card: #ffffff; --fg: #15201a; --muted: #5e6b63; --line: #d9ded9;
    --ok: #1f8a4c; --ok-bg: #e4f4ea; --no: #c43a2f; --no-bg: #fbe6e3; --ring: #e07a1f;
    --font: "Segoe UI", -apple-system, system-ui, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111614; --card: #1b221e; --fg: #eef2ee; --muted: #a5b0a9; --line: #333c36;
      --ok: #4fcf84; --ok-bg: #173424; --no: #ff7b6e; --no-bg: #3d1e1a; color-scheme: dark; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex; flex-direction: column; font-variant-numeric: tabular-nums;
  }
  .top { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .verdict { border-radius: 16px; padding: 14px 16px; background: var(--ok-bg); border: 2px solid var(--ok); display: flex; align-items: center; gap: 12px; }
  .verdict.no { background: var(--no-bg); border-color: var(--no); }
  .verdict .big { font-size: 1.6rem; font-weight: 800; color: var(--ok); white-space: nowrap; }
  .verdict.no .big { color: var(--no); }
  .verdict .txt { font-size: .9rem; line-height: 1.3; min-width: 0; }
  .verdict .txt small { display: block; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  input[type="datetime-local"] { flex: 1; min-width: 0; font: inherit; font-size: .95rem; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button { font: inherit; font-size: .9rem; padding: 9px 12px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--fg); white-space: nowrap; }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  #map { flex: 1; min-height: 320px; }
  .where { padding: 8px 16px; font-size: .9rem; display: flex; align-items: center; gap: 8px; background: var(--card); border-top: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.in { background: var(--no); } .dot.out { background: var(--ok); }
  .leaflet-container { background: var(--bg); font-family: var(--font); }
</style>
</head>
<body>

<div class="top">
  <div class="verdict" id="verdict">
    <div class="big" id="big">…</div>
    <div class="txt"><span id="why"></span><small id="when"></small></div>
  </div>
  <div class="row">
    <input type="datetime-local" id="t">
    <button type="button" id="now">Now</button>
    <button type="button" class="primary" id="gps">📍 Me</button>
  </div>
</div>

<div id="map"></div>

<div class="where"><span class="dot" id="dot"></span><span id="whereTxt">Tap the map to test a spot, or press 📍 Me</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ---------- Time rule (plate ends in 2) ----------
  const SEASON_START = "2026-10-12", SEASON_END = "2027-07-23";
  const HOLIDAYS = new Set([
    "2026-10-28","2026-12-25","2026-12-26",
    "2027-01-01","2027-01-06","2027-03-08","2027-03-25","2027-04-30","2027-05-01","2027-05-03","2027-06-21"
  ]);
  const pad = n => String(n).padStart(2,"0");
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const toLocalInput = d => `${key(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

  function check(d) {
    const k = key(d), day = d.getDay(), mins = d.getHours()*60 + d.getMinutes();
    if (k < SEASON_START || k > SEASON_END) return {ok:true, why:"Summer break, ring not active"};
    if (day === 0 || day === 6) return {ok:true, why:"Weekend, ring not active"};
    if (HOLIDAYS.has(k)) return {ok:true, why:"Public holiday, ring not active"};
    const endLbl = day === 5 ? "15:00" : "20:00", end = day === 5 ? 15*60 : 20*60;
    if (mins < 7*60 || mins >= end) return {ok:true, why:`Outside ring hours (07:00–${endLbl})`};
    if (d.getDate() % 2 === 0) return {ok:true, why:`Even date (${d.getDate()}), plate 2 allowed`};
    return {ok:false, why:`Odd date (${d.getDate()}), plate 2 blocked until ${endLbl}`};
  }
  const $ = id => document.getElementById(id);
  function render(d) {
    const r = check(d);
    $("verdict").classList.toggle("no", !r.ok);
    $("big").textContent = r.ok ? "ALLOWED" : "NO";
    $("why").textContent = r.why;
    $("when").textContent = d.toLocaleString("en-GB", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  }
  function setAndRender(d){ $("t").value = toLocalInput(d); render(d); }
  $("t").addEventListener("input", e => { if (e.target.value) render(new Date(e.target.value)); });
  $("now").onclick = () => setAndRender(new Date());
  setAndRender(new Date());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) setAndRender(new Date()); });

  // ---------- Ring polygon (traced from OpenStreetMap street geometry) ----------
  const RING = [
    [37.99169, 23.73130],
    [37.99142, 23.73304],
    [37.99114, 23.73544],
    [37.99077, 23.73716],
    [37.99061, 23.73886],
    [37.99018, 23.74088],
    [37.99005, 23.74238],
    [37.98969, 23.74382],
    [37.98946, 23.74573],
    [37.98879, 23.74872],
    [37.98858, 23.75055],
    [37.98793, 23.75344],
    [37.98722, 23.75781],
    [37.98693, 23.75935],
    [37.98658, 23.76026],
    [37.98548, 23.76012],
    [37.98514, 23.76081],
    [37.98564, 23.76237],
    [37.98598, 23.76286],
    [37.98585, 23.76448],
    [37.98572, 23.76516],
    [37.98495, 23.76413],
    [37.98393, 23.76356],
    [37.98329, 23.76234],
    [37.98220, 23.76137],
    [37.98090, 23.75761],
    [37.98052, 23.75627],
    [37.97904, 23.75584],
    [37.97542, 23.75151],
    [37.97483, 23.74786],
    [37.97151, 23.74758],
    [37.97039, 23.74745],
    [37.96890, 23.74717],
    [37.96775, 23.74700],
    [37.96599, 23.74670],
    [37.96589, 23.74685],
    [37.96490, 23.74564],
    [37.96428, 23.74453],
    [37.96348, 23.74309],
    [37.96269, 23.74168],
    [37.96183, 23.74014],
    [37.96087, 23.73841],
    [37.96033, 23.73722],
    [37.96010, 23.73690],
    [37.95960, 23.73620],
    [37.95900, 23.73430],
    [37.95870, 23.73290],
    [37.95840, 23.73150],
    [37.95810, 23.73060],
    [37.96050, 23.72800],
    [37.96290, 23.72450],
    [37.96230, 23.72400],
    [37.96110, 23.72220],

    [37.96660, 23.70300],
    [37.96770, 23.70100],
    [37.96860, 23.69970],
    [37.96900, 23.70000],
    [37.96980, 23.70220],

    [37.97190, 23.70517],
    [37.97273, 23.70641],
    [37.97349, 23.70757],
    [37.97445, 23.70895],

    [37.97711, 23.71352],
    [37.97774, 23.71488],
    [37.97859, 23.71604],
    [37.97913, 23.71675],
    [37.97968, 23.71479],
    [37.98064, 23.71229],
    [37.98093, 23.71154],
    [37.98192, 23.71239],
    [37.98305, 23.71319],
    [37.98399, 23.71427],
    [37.98399, 23.71540],
    [37.98430, 23.71684],
    [37.98492, 23.71927],
    [37.98521, 23.72060],
    [37.98567, 23.72216],
    [37.98564, 23.72412],
    [37.98629, 23.72523],
    [37.98695, 23.72636],
    [37.98771, 23.72766],
    [37.98848, 23.72896],
    [37.98923, 23.73023],
    [37.98958, 23.73084],
    [37.99097, 23.73104]
  ];
  function inside(lat, lng) {
    let ins = false;
    for (let i = 0, j = RING.length - 1; i < RING.length; j = i++) {
      const [yi, xi] = RING[i], [yj, xj] = RING[j];
      if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) ins = !ins;
    }
    return ins;
  }

  // ---------- Map ----------
  const map = L.map("map", {zoomControl:false}).setView([37.975, 23.733], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap contributors"
  }).addTo(map);
  L.polygon(RING, {color:"#e07a1f", weight:3, fillColor:"#e07a1f", fillOpacity:0.18}).addTo(map);

  let marker;
  function showPoint(lat, lng, label) {
    const isIn = inside(lat, lng);
    if (marker) marker.remove();
    marker = L.circleMarker([lat, lng], {radius:8, color: isIn ? "#c43a2f" : "#1f8a4c", fillOpacity:0.9}).addTo(map);
    $("dot").className = "dot " + (isIn ? "in" : "out");
    $("whereTxt").textContent = `${label}: ${isIn ? "INSIDE the ring" : "outside the ring"}`;
  }
  map.on("click", e => showPoint(e.latlng.lat, e.latlng.lng, "Tapped spot"));
  $("gps").onclick = () => {
    if (!navigator.geolocation) { $("whereTxt").textContent = "Location not available on this device"; return; }
    $("whereTxt").textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(
      p => { showPoint(p.coords.latitude, p.coords.longitude, "You"); map.setView([p.coords.latitude, p.coords.longitude], 15); },
      () => { $("whereTxt").textContent = "Location denied. Allow it in Settings → Safari → Location."; },
      {enableHighAccuracy:true, timeout:10000}
    );
  };
</script>
</body>
</html>
